xact-completion = { path = "crates/xact-completion" }
xact-completion-graph = { path = "crates/xact-completion-graph" }
xact-resolve = { path = "crates/xact-resolve" }
xact-reference = { path = "crates/xact-reference" }
xact-semantic = { path = "crates/xact-semantic" }
xact-policy = { path = "crates/xact-policy" }
xact-planner = { path = "crates/xact-planner" }
xact-executor = { path = "crates/xact-executor" }
xact-process = { path = "crates/xact-process" }
xact-resource = { path = "crates/xact-resource" }
xact-agent = { path = "crates/xact-agent" }
xact-team = { path = "crates/xact-team" }
